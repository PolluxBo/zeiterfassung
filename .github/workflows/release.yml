name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version aus Tag setzen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        run: |
          $v = if ($env:VERSION) { $env:VERSION } else { "1.0.0" }
          dotnet publish src/Zeiterfassung -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$v -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Zeiterfassung
          path: publish/Zeiterfassung.exe

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" publish/Zeiterfassung.exe --clobber
          } else {
            gh release create "${{ github.ref_name }}" publish/Zeiterfassung.exe --title "Zeiterfassung ${{ github.ref_name }}" --generate-notes
          }
